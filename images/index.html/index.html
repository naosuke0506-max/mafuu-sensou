<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔封戦争 — 戦闘フィールド試作(兵士・クロウル・ゴブリン・ゴブリン弓兵・獰猛なゴブリン)</title>
<style>
  :root {
    --bg-void: #0b0a0d;
    --bg-panel: #151217;
    --line-ash: #2c2730;
    --blood: #7a1f2b;
    --blood-bright: #a8283a;
    --bone: #cfc6b8;
    --bone-dim: #6f6a63;
    --claw-glow: #c9a15a;
    --hp-good: #7a8f4a;
    --hp-mid: #b8862f;
    --hp-bad: #a8283a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-void);
    color: var(--bone);
    font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  body {
    padding: 20px 14px 50px;
    background-image: radial-gradient(ellipse at 50% -10%, rgba(122,31,43,0.14), transparent 55%);
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.28em; color: var(--blood-bright);
    text-transform: uppercase; margin: 0 0 6px;
  }
  h1 { font-size: 22px; letter-spacing: 0.04em; margin: 0 0 10px; position: relative; padding-bottom: 12px; }
  h1::after {
    content: ""; position: absolute; left: 0; bottom: 0; width: 84px; height: 3px;
    background: linear-gradient(90deg, var(--claw-glow), var(--blood-bright) 70%, transparent);
    clip-path: polygon(0 0, 88% 0, 92% 60%, 100% 30%, 96% 100%, 0 100%);
  }
  .sub { font-size: 12px; color: var(--bone-dim); margin: 0 0 18px; line-height: 1.6; }

  .field {
    position: relative; height: 220px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 30%), var(--bg-panel);
    border: 1px solid var(--line-ash); border-radius: 4px; overflow: hidden;
  }
  .ground-line {
    position: absolute; left: 0; right: 0; bottom: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-ash) 10%, var(--line-ash) 90%, transparent);
  }
  .castle {
    position: absolute; bottom: 40px; width: 64px; height: 84px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .castle.enemy { left: 14px; }
  .castle.ally  { right: 14px; }
  .castle-icon {
    width: 56px; height: 64px;
    background: linear-gradient(180deg, #2a252c, #171419);
    border: 1px solid var(--line-ash);
    clip-path: polygon(0% 100%, 0% 35%, 15% 35%, 15% 15%, 30% 15%, 30% 35%, 45% 35%, 45% 10%, 55% 10%, 55% 35%, 70% 35%, 70% 15%, 85% 15%, 85% 35%, 100% 35%, 100% 100%);
  }
  .castle.enemy .castle-icon { background: linear-gradient(180deg, #3a1c22, #1c0f13); }
  .castle-label { font-size: 9.5px; color: var(--bone-dim); letter-spacing: 0.06em; margin-top: 4px; }
  .castle-hp-wrap {
    width: 56px; height: 6px; background: #000; border: 1px solid var(--line-ash);
    border-radius: 2px; margin-top: 3px; overflow: hidden;
  }
  .castle-hp-fill { height: 100%; background: var(--hp-good); width: 100%; transition: width 0.2s; }

  .soldier-unit {
    position: absolute; bottom: 40px; width: 70px; height: 70px;
    transform: translateX(-50%); display: none; z-index: 5;
  }
  .soldier-unit img {
    position: absolute; bottom: 0; left: 50%;
    max-height: 52px; max-width: none;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6));
  }
  .soldier-hp {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 5px; background: #000; border: 1px solid var(--line-ash);
    border-radius: 2px; overflow: hidden;
  }
  .soldier-hp-fill { height: 100%; background: var(--hp-good); width: 100%; }

  .kurowl-unit {
    position: absolute; bottom: 40px; width: 90px; height: 70px;
    transform: translateX(-50%); display: none; z-index: 5;
  }
  .kurowl-unit img {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%) scaleX(1) translateY(0);
    max-height: 46px; max-width: 100%;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6));
  }
  .catapult-unit {
    position: absolute; bottom: 40px; width: 170px; height: 90px;
    transform: translateX(-50%); display: none; z-index: 5;
  }
  .catapult-unit img {
    position: absolute; bottom: 0; left: 50%;
    max-height: 78px; max-width: none;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6));
  }
  .catapult-hp {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 5px; background: #000; border: 1px solid var(--line-ash);
    border-radius: 2px; overflow: hidden;
  }
  .catapult-hp-fill { height: 100%; background: var(--hp-good); width: 100%; }
  .brute-unit {
    position: absolute; bottom: 40px; width: 100px; height: 80px;
    transform: translateX(-50%); display: none; z-index: 5;
  }
  .brute-unit img {
    position: absolute; bottom: 0; left: 50%;
    max-height: 62px; max-width: none;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6));
  }
  .brute-hp {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 44px; height: 5px; background: #000; border: 1px solid var(--line-ash);
    border-radius: 2px; overflow: hidden;
  }
  .brute-hp-fill { height: 100%; background: var(--hp-good); width: 100%; }
  /* 咆哮バフ中の赤いオーラ(最弱の強さ・キャラ輪郭に沿ったdrop-shadow) */
  .soldier-unit img.buffed-aura,
  .kurowl-unit img.buffed-aura,
  .catapult-unit img.buffed-aura,
  .brute-unit img.buffed-aura {
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6)) drop-shadow(0 0 3px #ff2b2b) drop-shadow(0 0 5px #ff2b2b);
  }
  .projectile-unit {
    position: absolute; bottom: 40px; width: 40px; height: 40px;
    transform: translateX(-50%); z-index: 6; pointer-events: none;
  }
  .projectile-unit img {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    max-height: 30px; max-width: none;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
  }
  .impact-unit {
    position: absolute; bottom: 40px; width: 120px; height: 90px;
    transform: translateX(-50%); z-index: 4; pointer-events: none;
  }
  .impact-unit img {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    max-height: 80px; max-width: none;
  }
  .kurowl-hp {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 5px; background: #000; border: 1px solid var(--line-ash);
    border-radius: 2px; overflow: hidden;
  }
  .kurowl-hp-fill { height: 100%; background: var(--hp-bad); width: 100%; }

  .state-label {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: var(--claw-glow); letter-spacing: 0.05em; white-space: nowrap;
  }

  .controls {
    margin-top: 14px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px;
  }
  button.act {
    background: var(--bg-panel); border: 1px solid var(--line-ash); color: var(--bone);
    padding: 10px 8px; font-size: 12px; letter-spacing: 0.02em; border-radius: 3px;
    cursor: pointer; font-family: inherit;
  }
  button.act:hover { border-color: var(--blood); }
  button.act:disabled { opacity: 0.35; cursor: default; }
  button.danger { border-color: var(--blood); color: var(--blood-bright); }
  button.charge { border-color: var(--claw-glow); color: var(--claw-glow); }
  button.reset { border-color: var(--bone-dim); color: var(--bone-dim); }

  .log {
    margin-top: 14px; font-size: 11px; color: var(--bone-dim); line-height: 1.7;
    max-height: 130px; overflow-y: auto; padding: 10px 12px;
    background: var(--bg-panel); border: 1px solid var(--line-ash); border-radius: 4px;
  }
  .log div span { color: var(--claw-glow); }

  .stats {
    margin-top: 14px; font-size: 11px; color: var(--bone-dim);
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 4px 14px;
  }
  .stats b { color: var(--bone); font-weight: 600; }

  .unit-card {
    margin-top: 12px; padding: 12px 14px;
    background: var(--bg-panel); border: 1px solid var(--line-ash); border-radius: 4px;
  }
  .unit-card-head { display: flex; justify-content: space-between; align-items: center; }
  .unit-check { font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .unit-check input { width: 16px; height: 16px; }
  .unit-cost { font-size: 12px; color: var(--claw-glow); }
  .unit-stats-line { margin-top: 6px; font-size: 11px; color: var(--bone-dim); }

  .money-bar {
    margin-top: 4px; margin-bottom: 4px; font-size: 14px; color: var(--claw-glow);
    letter-spacing: 0.03em;
  }

  .slot-grid {
    margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .slot {
    aspect-ratio: 1 / 1; border-radius: 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg-panel); border: 1px dashed var(--line-ash);
    font-size: 10px; color: var(--bone-dim); text-align: center; padding: 4px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .slot.filled { border-style: solid; border-color: var(--claw-glow); color: var(--bone); box-shadow: 0 0 6px rgba(201,161,90,0.25) inset; }
  .slot .slot-icon { width: 70%; max-height: 65%; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }
  .slot .slot-cost { font-size: 9px; color: var(--claw-glow); margin-top: 3px; }
  .slot .slot-plus { font-size: 20px; color: var(--bone-dim); }

  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 8px; margin-top: 6px; }
  .roster-item {
    padding: 10px 12px; border-radius: 4px; cursor: pointer;
    background: var(--bg-panel); border: 1px solid var(--line-ash);
    display: flex; align-items: center; gap: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .roster-item:hover { border-color: var(--bone-dim); }
  .roster-item.selected { border-color: var(--blood-bright); box-shadow: 0 0 8px rgba(168,40,58,0.35) inset; }
  .roster-icon { width: 52px; height: 52px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }
  .roster-body { min-width: 0; }
  .roster-item .r-name { font-size: 13px; font-weight: 600; }
  .roster-item .r-cost { font-size: 11px; color: var(--claw-glow); margin-top: 2px; }
  .roster-item .r-stats { font-size: 10px; color: var(--bone-dim); margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap" id="formationScreen">
  <p class="eyebrow">魔封戦争 &mdash; 編成</p>
  <h1>出撃メンバーを選択</h1>
  <p class="sub">下のユニットをタップして選び、枠をタップして配置してください。枠をもう一度タップすると外せます。</p>

  <div class="slot-grid" id="slotGrid"></div>

  <p class="sub" style="margin-top:16px;">編成できるユニット</p>
  <div class="roster" id="rosterPanel"></div>

  <div class="controls">
    <button class="act charge" id="btnStartBattle">この編成で出撃</button>
  </div>
  <p class="sub" id="formationWarning" style="display:none; color: var(--blood-bright);">最低1体は枠に配置してください。</p>
</div>

<div class="wrap" id="battleScreen" style="display:none">
  <p class="eyebrow">魔封戦争 &mdash; 魔の平原</p>
  <h1>戦闘フィールド試作(兵士・クロウル・ゴブリン・ゴブリン弓兵・獰猛なゴブリン)</h1>
  <p class="sub">兵士は「出撃」を押すたびに1体ずつ追加出撃します。敵がいなくなると相手の城へ進軍して攻撃します。「突撃/突進」中は完全無敵で、最初に触れた敵を無条件でダウンさせます(ダメージなし)。ダウン中の敵は5秒間無防備になります。</p>

  <div class="money-bar">所持金: <b id="moneyText">0</b>円</div>

  <div class="field" id="field">
    <div class="ground-line"></div>
    <div class="castle enemy">
      <div class="castle-icon"></div>
      <div class="castle-label">敵軍の城 <span id="enemyCastleHpText">150</span></div>
      <div class="castle-hp-wrap"><div class="castle-hp-fill" id="enemyCastleHpFill"></div></div>
    </div>
    <div class="castle ally">
      <div class="castle-icon"></div>
      <div class="castle-label">自軍の城 <span id="allyCastleHpText">150</span></div>
      <div class="castle-hp-wrap"><div class="castle-hp-fill" id="allyCastleHpFill"></div></div>
    </div>
  </div>

  <div class="controls">
    <button class="act" id="btnSpawnSoldierRight">兵士を出撃(自軍/右, 50円)</button>
    <button class="act" id="btnSpawnSoldierLeft">兵士を出撃(敵軍/左, 50円)</button>
    <button class="act" id="btnSpawnKurowlLeft">クロウルを出撃(敵軍/左, 140円)</button>
    <button class="act" id="btnSpawnKurowlRight">クロウルを出撃(自軍/右, 140円)</button>
    <button class="act" id="btnSpawnGoblinRight">ゴブリンを出撃(自軍/右, 30円)</button>
    <button class="act" id="btnSpawnGoblinLeft">ゴブリンを出撃(敵軍/左, 30円)</button>
    <button class="act" id="btnSpawnArcherRight">ゴブリン弓兵を出撃(自軍/右, 45円)</button>
    <button class="act" id="btnSpawnArcherLeft">ゴブリン弓兵を出撃(敵軍/左, 45円)</button>
    <button class="act" id="btnSpawnCatapultRight">ゴブリンカタパルトを出撃(自軍/右, 120円)</button>
    <button class="act" id="btnSpawnCatapultLeft">ゴブリンカタパルトを出撃(敵軍/左, 120円)</button>
    <button class="act" id="btnSpawnBruteRight">獰猛なゴブリンを出撃(自軍/右, 90円)</button>
    <button class="act" id="btnSpawnBruteLeft">獰猛なゴブリンを出撃(敵軍/左, 90円)</button>
    <button class="act charge" id="btnDashSoldier">兵士 全員「突撃！」発動</button>
    <button class="act charge" id="btnDashKurowl">クロウル 全員「突進」発動</button>
    <button class="act charge" id="btnDashGoblin">ゴブリン 全員「突撃！」発動</button>
    <button class="act charge" id="btnDashArcher">ゴブリン弓兵 全員「突撃！」発動</button>
    <button class="act charge" id="btnDashBrute">獰猛なゴブリン 全員「突撃！」発動</button>
    <button class="act reset" id="btnReset">編成に戻る</button>
  </div>

  <div class="stats" id="statsBox"></div>

  <div class="log" id="log"></div>
</div>

function getBuffMultiplier(u, now) {
  return (u.buffUntil && now < u.buffUntil) ? BRUTE_CONFIG.roarBuffMultiplier : 1;
}

// 咆哮: 範囲内の未バフの味方ゴブリン族(自分自身含む)に「10秒間攻撃力+40%」を付与(重複時は10秒にリセット)
function applyBruteRoarBuff(u, now) {
  const applyTo = [];
  for (const other of allUnits()) {
    if (other.dead || !other.spawned) continue;
    if (other.team !== u.team) continue;
    if (!isGoblinKin(other.kind)) continue;
    if (dist(u, other) > BRUTE_CONFIG.roarBuffRadius) continue;
    applyTo.push(other);
  }
  for (const other of applyTo) {
    other.buffUntil = now + BRUTE_CONFIG.roarBuffDurationMs;
  }
  if (applyTo.length) {
    logMsg(`獰猛なゴブリン#${u.id}の咆哮 → 周囲の味方ゴブリン族${applyTo.length}体に「攻撃力+40%(10秒)」を付与した。`);
  }
}

function triggerBruteRoar(u, now) {
  u.lockedMotion = "roar";
  setUnitMotion(u, "roar");
  u.lockedUntil = now + motionDuration(BRUTE_MOTIONS.roar);
  playUnitVoice(u, "warCry");
  applyBruteRoarBuff(u, now);
}

// 咆哮の割り込み判定: 「動ける状態(待機・移動)」の獰猛なゴブリンの周囲に、未バフの味方ゴブリン族が
// 新たに入ってきた場合に確定で再発動する。攻撃・中距離攻撃・ダウン中などには割り込まない。
function checkBruteRoarInterrupt(u, now) {
  if (u.kind !== "brute" || u.dead || u.isDown) return;
  if (u.lockedMotion) return; // 攻撃・中距離攻撃・咆哮・ダウン/起き上がり中は割り込まない
  if (u.motionKey !== "walk" && u.motionKey !== "idle") return;
  for (const other of allUnits()) {
    if (other.dead || !other.spawned) continue;
    if (other.team !== u.team) continue;
    if (!isGoblinKin(other.kind)) continue;
    if (dist(u, other) > BRUTE_CONFIG.roarBuffRadius) continue;
    if (!other.buffUntil || now >= other.buffUntil) {
      triggerBruteRoar(u, now);
      return;
    }
  }
}

function motionDuration(m) {
  if (m.frameDurations) return m.frameDurations.reduce((a, b) => a + b, 0);
  return m.frames.length * m.msPerFrame;
}

// 専用の「起き上がり」画像がまだ無いキャラは、既存の「吹き飛ばし」モーションを
// そのまま「ダウン(倒れて保持)」として使い、そのコマ順を逆再生したものを
// 「起き上がり」として自動生成する。専用画像ができたら該当キャラのMOTIONSに
// down/getupを直接定義すれば、そちらが優先されて自動生成は行われない。
// =====================================================================
const DOWN_HOLD_MS = 5000; // ダウン中(無防備)の保持時間

function reverseMotion(motion) {
  const frames = motion.frames.slice().reverse();
  const out = { frames, loop: false };
  if (motion.frameDurations) out.frameDurations = motion.frameDurations.slice().reverse();
  else out.msPerFrame = motion.msPerFrame;
  return out;
}

for (const kind of Object.keys(MOTIONS_BY_KIND)) {
  const motions = MOTIONS_BY_KIND[kind];
  if (!motions.down) motions.down = motions.knockback; // 倒れて保持 = 吹き飛ばしモーションを流用
  if (!motions.getup) motions.getup = reverseMotion(motions.down); // 起き上がり = 逆再生で自動生成
}

function playVoice(voiceCategory, key) {
  let src = VOICE_SETS[voiceCategory] && VOICE_SETS[voiceCategory][key];
  if (!src) return;
  if (Array.isArray(src)) {
    // 複数バリエーションが登録されている場合はランダムに1つ選んで再生する(単調さを避けるため)
    src = src[Math.floor(Math.random() * src.length)];
  }
  if (!src) return;
  try {
    const audio = new Audio(src);
    audio.play().catch(() => {}); // 自動再生ブロック等は静かに無視
  } catch (e) { /* 再生できない環境でも処理を止めない */ }
}

function playUnitVoice(u, key) {
  const category = CONFIG_BY_KIND[u.kind].voiceCategory;
  playVoice(category, key);
}

  const unitClass = kind === "kurowl" ? "kurowl-unit" : kind === "catapult" ? "catapult-unit" : kind === "brute" ? "brute-unit" : "soldier-unit";
  const hpWrapClass = kind === "kurowl" ? "kurowl-hp" : kind === "catapult" ? "catapult-hp" : kind === "brute" ? "brute-hp" : "soldier-hp";
  const hpFillClass = kind === "kurowl" ? "kurowl-hp-fill" : kind === "catapult" ? "catapult-hp-fill" : kind === "brute" ? "brute-hp-fill" : "soldier-hp-fill";

  const unit = document.createElement("div");
  unit.className = unitClass;
  unit.style.display = "none";

  const stateLabel = document.createElement("span");
  stateLabel.className = "state-label";
  stateLabel.textContent = "待機";

  const hpWrap = document.createElement("div");
  hpWrap.className = hpWrapClass;
  const hpFill = document.createElement("div");
  hpFill.className = hpFillClass;
  hpWrap.appendChild(hpFill);

  const img = document.createElement("img");
  img.alt = UNIT_LABEL_BY_KIND[kind];

  unit.appendChild(stateLabel);
  unit.appendChild(hpWrap);
  unit.appendChild(img);
  els.field.appendChild(unit);

  return { unit, stateLabel, hpFill, img };
}

// =====================================================================
// ユニット生成
// =====================================================================
function createUnit(kind, side) {
  const cfg = CONFIG_BY_KIND[kind];
  const startX = side === "left" ? 0 : FIELD.length;
  const team = side === "left" ? "enemy" : "ally";
  const defaultFacing = side === "left" ? 1 : -1;
  const el = createUnitDom(kind);
  const u = {
    id: ++unitIdSeq,
    kind,
    team,
    side,
    xPx: startX,
    facing: defaultFacing,
    defaultFacing,
    hp: cfg.maxHp,
    maxHp: cfg.maxHp,
    weight: cfg.weight,
    isCastle: false,
    motionKey: "idle",
    frameIndex: 0,
    lastFrameTime: 0,
    lastMoveTime: performance.now(),
    hitAppliedFrames: new Set(),
    spawned: true,
    dead: false,
    deadAt: 0,
    removed: false,
    lockedMotion: null,
    lockedUntil: 0,
    dashUntil: 0,
    dashHitTargets: new Set(), // 突撃中に既に判定済みの対象(同じ相手に何度も判定しない)
    isDown: false, // ダウン中(無防備・移動も攻撃もしない)
    hasEvaded: false,
    midrangeStartX: 0,
    jumpHeightPx: 0,
    buffUntil: 0, // 獰猛なゴブリンの咆哮バフ(ゴブリン族のみ有効): この時刻まで攻撃力+40%
    el
  };
  const targetArr = kind === "kurowl" ? kurowls : kind === "goblin" ? goblins : kind === "archer" ? archers : kind === "catapult" ? catapults : kind === "brute" ? brutes : soldiers;
  targetArr.push(u);
  el.unit.style.display = "block";
  setUnitMotion(u, "walk");
  return u;
}

function createCastle(team, xPx) {
  return { team, xPx, hp: CASTLE_CONFIG.maxHp, maxHp: CASTLE_CONFIG.maxHp, isCastle: true, spawned: true, dead: false };
}

function initCastles() {
  enemyCastle = createCastle("enemy", 0);
  allyCastle = createCastle("ally", FIELD.length);
  updateCastleUI(enemyCastle, els.enemyCastleHpFill, els.enemyCastleHpText);
  updateCastleUI(allyCastle, els.allyCastleHpFill, els.allyCastleHpText);
}

function updateCastleUI(castle, fillEl, textEl) {
  const pct = Math.max(0, (castle.hp / castle.maxHp) * 100);
  fillEl.style.width = `${pct}%`;
  fillEl.style.background = pct > 50 ? "var(--hp-good)" : pct > 20 ? "var(--hp-mid)" : "var(--hp-bad)";
  textEl.textContent = Math.ceil(castle.hp);
}

// =====================================================================
// 共通ヘルパー
// =====================================================================
function allUnits() {
  return soldiers.concat(kurowls, goblins, archers, catapults, brutes);
}

function dist(a, b) {
  return Math.abs(a.xPx - b.xPx);
}

function isOpponent(self, other) {
  return !!(other && other.spawned && !other.dead && other.team !== self.team);
}

function possibleEnemyTargets(self) {
  const arr = [];
  for (const u of allUnits()) if (u !== self && isOpponent(self, u)) arr.push(u);
  if (isOpponent(self, enemyCastle)) arr.push(enemyCastle);
  if (isOpponent(self, allyCastle)) arr.push(allyCastle);
  return arr;
}

function findNearestTarget(self) {
  const candidates = possibleEnemyTargets(self);
  if (!candidates.length) return null;
  candidates.sort((a, b) => dist(self, a) - dist(self, b));
  return candidates[0];
}

function computeFacing(self, other, defaultFacing) {
  if (isOpponent(self, other)) {
    const diff = other.xPx - self.xPx;
    if (Math.abs(diff) < 0.01) return self.facing || defaultFacing;
    return diff > 0 ? 1 : -1;
  }
  return defaultFacing;
}

function movementBounds(self, other, facing) {
  // 突撃/突進中は敵に位置を塞がれず、無敵のまま通り抜けられる(衝突判定はresolveChargeHit側で処理する)
  const selfDashKey = self.kind === "kurowl" ? "charge" : "dash";
  const selfIsDashing = self.motionKey === selfDashKey;
  const blockingOther = (isOpponent(self, other) && !selfIsDashing) ? other : null;
  if (facing === 1) {
    const upper = blockingOther ? blockingOther.xPx : FIELD.length;
    return { min: 0, max: upper };
  } else {
    const lower = blockingOther ? blockingOther.xPx : 0;
    return { min: lower, max: FIELD.length };
  }
}

// 同じ陣営のユニット同士(兵士・クロウル問わず)が重ならないよう間隔を確保する
function allyBlockBound(self, facing) {
  let bound = null;
  for (const other of allUnits()) {
    if (other === self || !other.spawned || other.dead || other.team !== self.team) continue;
    if (facing === 1 && other.xPx > self.xPx) {
      const limit = other.xPx - SOLDIER_QUEUE_GAP;
      if (bound === null || limit < bound) bound = limit;
    } else if (facing === -1 && other.xPx < self.xPx) {
      const limit = other.xPx + SOLDIER_QUEUE_GAP;
      if (bound === null || limit > bound) bound = limit;
    }
  }
  return bound;
}

function combinedUnitBounds(u, facing, target) {
  const base = target ? movementBounds(u, target, facing) : { min: 0, max: FIELD.length };
  const allyLimit = allyBlockBound(u, facing);
  if (allyLimit === null) return base;
  if (facing === 1) return { min: base.min, max: Math.min(base.max, allyLimit) };
  return { min: Math.max(base.min, allyLimit), max: base.max };
}

function findAdjacentAllyAhead(u, facing) {
  let best = null, bestGap = Infinity;
  for (const other of allUnits()) {
    if (other === u || !other.spawned || other.dead || other.team !== u.team) continue;
    if (facing === 1 && other.xPx > u.xPx) {
      const gap = other.xPx - u.xPx;
      if (gap < bestGap) { bestGap = gap; best = other; }
    } else if (facing === -1 && other.xPx < u.xPx) {
      const gap = u.xPx - other.xPx;
      if (gap < bestGap) { bestGap = gap; best = other; }
    }
  }
  if (!best) return null;
  return Math.abs(bestGap - SOLDIER_QUEUE_GAP) < 1 ? best : null;
}

function isChainEngaged(u, facing, seen) {
  seen = seen || new Set();
  if (seen.has(u)) return false;
  seen.add(u);
  const ahead = findAdjacentAllyAhead(u, facing);
  if (!ahead) return false;
  const target = findNearestTarget(u);
  if (!target) return false;
  const cfg = CONFIG_BY_KIND[u.kind];
  // 前にいる味方の位置(=自分がブロックされて到達できる位置)が、自分自身の射程内でなければ連鎖させない
  // (例: 射程250のゴブリン弓兵の後ろに射程50のゴブリンが並んでも、実際に届く距離でなければ攻撃扱いにしない)
  if (dist(ahead, target) > cfg.meleeRange) return false;
  if (isEngagedMotion(ahead.kind, ahead.motionKey)) return true;
  return isChainEngaged(ahead, facing, seen);
}

// =====================================================================
// モーション設定
// =====================================================================
function setUnitMotion(u, key) {
  if (u.motionKey === key) return;
  u.motionKey = key;
  u.frameIndex = 0;
  const now = performance.now();
  u.lastFrameTime = now;
  u.lastMoveTime = now;
  u.hitAppliedFrames = new Set();
  u.el.stateLabel.textContent = motionLabel(u.kind, key);
  if ((u.kind === "kurowl" || u.kind === "brute") && key === "midrange") {
    u.midrangeStartX = u.xPx;
    if (u.kind === "brute") {
      // 獰猛なゴブリンは発生時点の間合いをそのまま跳ぶ距離にする(その場に足止めした敵まで届くように)
      const t = findNearestTarget(u);
      u.midrangeLeapAdvance = t ? dist(u, t) : 0;
    }
  }
  if (u.kind === "kurowl" && key === "melee") playUnitVoice(u, "attack");
  if (u.kind === "kurowl" && key === "walk") {
    // 歩行に切り替わるたびに鳴らすと煩いので、間隔を空けて再生する
    if (!u.lastWalkSoundAt || now - u.lastWalkSoundAt > 4000) {
      u.lastWalkSoundAt = now;
      playUnitVoice(u, "walk");
    }
  }
}

// =====================================================================
// 接近評価
// =====================================================================
function evaluateUnitState(u, now) {
  if (u.lockedMotion) return;
  const target = findNearestTarget(u);
  if (!target) {
    if (u.motionKey !== "walk") setUnitMotion(u, "walk");
    return;
  }
  const d = dist(u, target);
  if (u.kind === "kurowl") {
    const inMelee = d <= KUROWL_CONFIG.meleeRange || isChainEngaged(u, u.facing);
    if (inMelee) {
      setUnitMotion(u, "melee");
    } else if (d >= KUROWL_CONFIG.midRangeMin && d <= KUROWL_CONFIG.midRangeMax) {
      setUnitMotion(u, "midrange");
    } else {
      setUnitMotion(u, "walk");
    }
  } else if (u.kind === "brute") {
    const inMelee = d <= BRUTE_CONFIG.meleeRange || isChainEngaged(u, u.facing);
    if (inMelee) {
      setUnitMotion(u, "attack");
    } else if (d >= BRUTE_CONFIG.midRangeMin && d <= BRUTE_CONFIG.midRangeMax) {
      setUnitMotion(u, "midrange");
    } else {
      setUnitMotion(u, "walk");
    }
  } else {
    // soldier / goblin など近接攻撃タイプ共通
    const cfg = CONFIG_BY_KIND[u.kind];
    if (cfg.minRange && d < cfg.minRange) {
      // 最小射程より近い敵には攻撃できない(カタパルトなど)。移動もせずその場で待機する
      setUnitMotion(u, "idle");
    } else {
      const inRange = d <= cfg.meleeRange || isChainEngaged(u, u.facing);
      setUnitMotion(u, inRange ? "attack" : "walk");
    }
  }
}

// =====================================================================
// ダメージ処理
// =====================================================================
function damageCastle(castle, dmg, sourceLabel) {
  if (castle.dead) return;
  castle.hp = Math.max(0, castle.hp - dmg);
  const fillEl = castle.team === "enemy" ? els.enemyCastleHpFill : els.allyCastleHpFill;
  const textEl = castle.team === "enemy" ? els.enemyCastleHpText : els.allyCastleHpText;
  updateCastleUI(castle, fillEl, textEl);
  const label = castle.team === "enemy" ? "敵軍の城" : "自軍の城";
  logMsg(`${sourceLabel} → ${label}に<b>${dmg}</b>ダメージ(残り${castle.hp.toFixed(0)})`);
  if (castle.hp <= 0) {
    castle.dead = true;
    logMsg(`${label}が破壊された!`);
  }
}

function damageUnit(u, dmg, sourceLabel) {
  if (u.dead) return;
  const label = `${UNIT_LABEL_BY_KIND[u.kind]}#${u.id}`;

  // ゴブリンの特殊能力: 出撃後、最初に受ける攻撃を必ず1回だけ完全回避する
  if (u.kind === "goblin" && !u.hasEvaded && u.motionKey !== "dash" && !u.isDown) {
    u.hasEvaded = true;
    logMsg(`${sourceLabel} → ${label}は「回避」で攻撃を完全に見切った!(無傷)`);
    u.lockedMotion = "evade";
    u.lockedUntil = performance.now() + motionDuration(GOBLIN_MOTIONS.evade);
    setUnitMotion(u, "evade");
    playUnitVoice(u, "evade");
    // 自分の向きと逆(後方)へ跳躍して距離を取る
    const pushDir = u.facing === 1 ? -1 : 1;
    u.xPx = Math.min(FIELD.length, Math.max(0, u.xPx + pushDir * GOBLIN_CONFIG.evadeJumpDistance));
    return;
  }

  if (u.kind === "soldier" || u.kind === "goblin" || u.kind === "archer") {
    if (u.motionKey === "dash") {
      logMsg(`${sourceLabel} → ${label}は突撃中のため無敵、ダメージを無効化した。`);
      return;
    }
    const motions = MOTIONS_BY_KIND[u.kind];
    u.hp = Math.max(0, u.hp - dmg);
    logMsg(`${sourceLabel} → ${label}に<b>${dmg}</b>ダメージ(残り${u.hp.toFixed(0)})`);
    if (u.hp <= 0) {
      u.dead = true;
      u.isDown = false;
      u.deadAt = performance.now();
      u.lockedMotion = null;
      setUnitMotion(u, "knockback"); // frameIndex=0から吹き飛ばしモーションを再生
      u.removeAt = u.deadAt + motionDuration(motions.knockback);
      playUnitVoice(u, "death");
      logMsg(`${label}が倒れた。`);
    } else if (u.isDown) {
      // ダウン中は絶対に怯まない(ダメージだけ通し、ダウン/起き上がりモーションを継続させる)
      logMsg(`${label}はダウン中のため怯まず、そのまま倒れ続けている。`);
    } else {
      u.lockedMotion = "flinch";
      u.lockedUntil = performance.now() + motionDuration(motions.flinch);
      setUnitMotion(u, "flinch");
      playUnitVoice(u, "pain");
    }
    return;
  }

  // ゴブリンカタパルト: カタパルト本体のHPが0になると、搭乗ゴブリンが降りて通常ゴブリンとして戦い続ける
  if (u.kind === "catapult") {
    u.hp = Math.max(0, u.hp - dmg);
    logMsg(`${sourceLabel} → ${label}に<b>${dmg}</b>ダメージ(残り${u.hp.toFixed(0)})`);
    if (u.hp <= 0) {
      u.dead = true;
      u.isDown = false;
      u.deadAt = performance.now();
      u.lockedMotion = null;
      setUnitMotion(u, "destroy"); // 破壊演出(13コマ)を再生。終了後、同じ位置に通常ゴブリンを生成
      u.removeAt = u.deadAt + motionDuration(CATAPULT_MOTIONS.destroy);
      u.spawnGoblinOnRemove = true;
      playUnitVoice(u, "death");
      logMsg(`${label}が大破!搭乗していたゴブリンが降りて戦い続ける。`);
    } else if (u.isDown) {
      // ダウン中は絶対に怯まない
      logMsg(`${label}はダウン中のため怯まず、そのまま倒れ続けている。`);
    } else {
      u.lockedMotion = "flinch";
      u.lockedUntil = performance.now() + motionDuration(CATAPULT_MOTIONS.flinch);
      setUnitMotion(u, "flinch");
      playUnitVoice(u, "pain");
    }
    return;
  }

  // 獰猛なゴブリン: 攻撃・中距離攻撃・咆哮モーション中はすべて突撃以外で怯まないスーパーアーマー
  // (ダメージ自体は通常通り通り、HP0になった場合はスーパーアーマーを無視してダウンして死亡する)
  if (u.kind === "brute") {
    if (u.motionKey === "dash") {
      logMsg(`${sourceLabel} → ${label}は突撃中のため無敵、ダメージを無効化した。`);
      return;
    }
    const motions = MOTIONS_BY_KIND[u.kind];
    const superArmor = u.motionKey === "attack" || u.motionKey === "midrange" || u.motionKey === "roar";
    u.hp = Math.max(0, u.hp - dmg);
    logMsg(`${sourceLabel} → ${label}に<b>${dmg}</b>ダメージ(残り${u.hp.toFixed(0)})${superArmor ? "(スーパーアーマー中のため怯まず)" : ""}`);
    if (u.hp <= 0) {
      u.dead = true;
      u.isDown = false;
      u.deadAt = performance.now();
      u.lockedMotion = null;
      setUnitMotion(u, "knockback");
      u.removeAt = u.deadAt + motionDuration(motions.knockback);
      playUnitVoice(u, "death");
      logMsg(`${label}が倒れた。`);
    } else if (u.isDown) {
      logMsg(`${label}はダウン中のため怯まず、そのまま倒れ続けている。`);
    } else if (!superArmor) {
      u.lockedMotion = "flinch";
      u.lockedUntil = performance.now() + motionDuration(motions.flinch);
      setUnitMotion(u, "flinch");
      playUnitVoice(u, "pain");
    }
    return;
  }

  // kurowl
  if (u.motionKey === "charge") {
    logMsg(`${sourceLabel} → ${label}は突進中のため無敵、ダメージを無効化した。`);
    return;
  }
  const superArmor = u.motionKey === "midrange";
  const meleeArmored = u.motionKey === "melee"; // 近接攻撃モーション全体を通してアーマー(怯まない)
  const finalDmg = superArmor ? dmg / 2 : dmg;
  u.hp = Math.max(0, u.hp - finalDmg);
  const noFlinch = superArmor || meleeArmored;
  logMsg(`${sourceLabel} → ${label}に<b>${finalDmg}</b>ダメージ(残り${u.hp.toFixed(0)})${superArmor ? "(中距離攻撃中のため半減・怯まず)" : meleeArmored ? "(近接攻撃中のためアーマーで怯まず)" : ""}`);
  if (u.hp <= 0) {
    u.dead = true;
    u.isDown = false;
    u.deadAt = performance.now();
    setUnitMotion(u, "knockback"); // frameIndex=0から吹き飛ばしモーションを再生
    u.removeAt = u.deadAt + motionDuration(KUROWL_MOTIONS.knockback);
    playUnitVoice(u, "death");
    logMsg(`${label}が倒れた。`);
  } else if (u.isDown) {
    // ダウン中は絶対に怯まない
    logMsg(`${label}はダウン中のため怯まず、そのまま倒れ続けている。`);
  } else if (!noFlinch) {
    u.lockedMotion = "flinch";
    u.lockedUntil = performance.now() + motionDuration(KUROWL_MOTIONS.flinch);
    setUnitMotion(u, "flinch");
    playUnitVoice(u, "pain");
  }
}

function applyDamageTo(target, dmg, sourceLabel) {
  if (target.isCastle) damageCastle(target, dmg, sourceLabel);
  else damageUnit(target, dmg, sourceLabel);
}

// =====================================================================
// 突撃/突進の激突判定(新システム)
// 最初に触れた1体は無条件でダウンさせる(ダメージなし)。突撃モーション中に
// ダウンしていない敵とさらに接触した場合のみ衝突判定:
//   自分の体重 < 相手の体重 → 自分がダウンして突撃中断
//   自分の体重 ≥ 相手の体重 → 相手もダウンさせて直進を継続(何度でも連鎖)
// 城への突撃はダメージなし、当たったらその場で無敵のまま止まるだけ。
// =====================================================================
function isUnitDashing(t) {
  if (!t || t.isCastle) return false;
  const dk = t.kind === "kurowl" ? "charge" : "dash";
  return t.motionKey === dk;
}

// 突撃/突進中専用: 既にダウン済み・既に判定済み・相手が突撃中(完全無敵)の場合を除外して
// 「次に衝突すべき相手」を探す
function findNextChargeTarget(u) {
  const candidates = possibleEnemyTargets(u).filter(t =>
    t.isCastle || (!t.dead && !t.isDown && !isUnitDashing(t) && !u.dashHitTargets.has(t.id))
  );
  if (!candidates.length) return null;
  candidates.sort((a, b) => dist(u, a) - dist(u, b));
  return candidates[0];
}

function knockDown(u, sourceLabel) {
  if (!u || u.isCastle || u.dead) return;
  u.isDown = true;
  u.dashUntil = 0; // 自分がダウンする場合は突撃状態も終了させる
  setUnitMotion(u, "down");
  u.lockedMotion = "down";
  u.lockedUntil = performance.now() + motionDuration(MOTIONS_BY_KIND[u.kind].down) + DOWN_HOLD_MS;
  playUnitVoice(u, "pain");
  logMsg(`${sourceLabel} → ${UNIT_LABEL_BY_KIND[u.kind]}#${u.id}がダウンした!(${(DOWN_HOLD_MS / 1000).toFixed(0)}秒間無防備)`);
}

function triggerFlinch(u, sourceLabel) {
  if (!u || u.isCastle || u.dead || u.isDown) return;
  const motions = MOTIONS_BY_KIND[u.kind];
  setUnitMotion(u, "flinch");
  u.lockedMotion = "flinch";
  u.lockedUntil = performance.now() + motionDuration(motions.flinch);
  playUnitVoice(u, "pain");
  logMsg(`${sourceLabel} → ${UNIT_LABEL_BY_KIND[u.kind]}#${u.id}が怯んだ(体重で上回りダウンはしなかった)。`);
}

function resolveChargeHit(u) {
  const target = findNextChargeTarget(u);
  if (!target) return;
  const cfg = CONFIG_BY_KIND[u.kind];
  if (dist(u, target) > cfg.meleeRange) return;

  const abilityName = u.kind === "kurowl" ? "突進" : "突撃！";
  const abilityLabel = `${UNIT_LABEL_BY_KIND[u.kind]}#${u.id}の「${abilityName}」`;

  if (target.isCastle) {
    // 城への突撃はダメージなし。無敵のままその場に留まる(移動限界は combinedUnitBounds 側で処理済み)
    if (u.kind === "kurowl" && !u.dashHitTargets.has("castle")) {
      u.dashHitTargets.add("castle");
      playUnitVoice(u, "chargeImpact");
    }
    return;
  }

  if (target.dead || target.isDown) return; // 既にダウン中/死亡している相手は素通り
  if (u.dashHitTargets.has(target.id)) return; // 同じ相手への判定は1回のみ
  u.dashHitTargets.add(target.id);

  if (u.kind === "kurowl") playUnitVoice(u, "chargeImpact");

  // 体重比較による衝突判定(1体目から常にこのルールを適用)
  if (u.weight < target.weight) {
    // 自分の方が軽い: 自分がダウンし、相手は怯むだけ(ダウンしない)。突撃はここで終了
    knockDown(u, abilityLabel);
    triggerFlinch(target, abilityLabel);
  } else {
    // 自分と同等以上の重さ: 相手をダウンさせて直進を継続(何度でも連鎖可能)
    knockDown(target, abilityLabel);
  }
}

// =====================================================================
// ゴブリンカタパルトの投擲物(岩)・着弾エフェクト
// =====================================================================
function fieldScale() {
  const playAreaPx = els.field.clientWidth - FIELD.leftMargin - FIELD.rightMargin;
  return playAreaPx > 0 ? playAreaPx / FIELD.length : 1;
}
function fieldScreenX(xPx) {
  return FIELD.leftMargin + xPx * fieldScale();
}

function spawnProjectile(u, target, label) {
  const cfg = CONFIG_BY_KIND.catapult;
  const el = document.createElement("div");
  el.className = "projectile-unit";
  const img = document.createElement("img");
  img.src = CATAPULT_FRAMES.rock_fly;
  el.appendChild(img);
  els.field.appendChild(el);

  projectiles.push({
    id: ++projectileIdSeq,
    team: u.team,
    xStart: u.xPx,
    xTarget: target.xPx,
    startTime: performance.now(),
    duration: cfg.projectileFlightMs,
    arcHeight: cfg.projectileArcHeight,
    label,
    resolved: false,
    el
  });
}

function resolveSplashDamage(xImpact, attackerTeam, label) {
  const cfg = CONFIG_BY_KIND.catapult;
  for (const unit of allUnits()) {
    if (unit.dead || unit.team === attackerTeam) continue;
    const d = Math.abs(unit.xPx - xImpact);
    if (d > cfg.splashRadius) continue;
    const frac = d / cfg.splashRadius;
    const dmg = Math.round(cfg.meleeHitDamage - (cfg.meleeHitDamage - cfg.splashMinDamage) * frac);
    applyDamageTo(unit, dmg, label);
  }
  for (const castle of [enemyCastle, allyCastle]) {
    if (!castle || castle.dead || castle.team === attackerTeam) continue;
    const d = Math.abs(castle.xPx - xImpact);
    if (d > cfg.splashRadius) continue;
    const frac = d / cfg.splashRadius;
    const dmg = Math.round(cfg.meleeHitDamage - (cfg.meleeHitDamage - cfg.splashMinDamage) * frac);
    damageCastle(castle, dmg, label);
  }
}

function spawnImpactEffect(xImpact) {
  const frames = ["impact_1", "impact_2", "dust_1", "dust_2", "dust_3", "dust_4", "dust_5", "dust_6"];
  const frameDurations = [80, 100, 120, 150, 150, 150, 150, 150];
  const el = document.createElement("div");
  el.className = "impact-unit";
  const img = document.createElement("img");
  img.src = CATAPULT_FRAMES[frames[0]];
  el.appendChild(img);
  els.field.appendChild(el);
  el.style.left = `${fieldScreenX(xImpact)}px`;

  impactEffects.push({
    id: ++effectIdSeq,
    xImpact,
    frames,
    frameDurations,
    frameIndex: 0,
    lastFrameTime: performance.now(),
    el,
    img
  });
}

function tickProjectiles(now) {
  for (const p of projectiles) {
    const t = Math.min(1, (now - p.startTime) / p.duration);
    const curX = p.xStart + (p.xTarget - p.xStart) * t;
    const arc = 4 * p.arcHeight * t * (1 - t); // 放物線(見た目)
    p.el.style.left = `${fieldScreenX(curX)}px`;
    p.el.style.transform = `translateX(-50%) translateY(${-arc}px)`;
    if (t >= 1 && !p.resolved) {
      p.resolved = true;
      resolveSplashDamage(p.xTarget, p.team, p.label);
      spawnImpactEffect(p.xTarget);
      p.el.remove();
    }
  }
  projectiles = projectiles.filter(p => !p.resolved);
}

function tickImpactEffects(now) {
  for (const e of impactEffects) {
    const frameDt = now - e.lastFrameTime;
    if (frameDt >= e.frameDurations[e.frameIndex] && e.frameIndex < e.frames.length - 1) {
      e.frameIndex++;
      e.lastFrameTime = now;
      e.img.src = CATAPULT_FRAMES[e.frames[e.frameIndex]];
    }
    e.el.style.left = `${fieldScreenX(e.xImpact)}px`;
    e.done = e.frameIndex >= e.frames.length - 1 && (now - e.lastFrameTime) >= e.frameDurations[e.frameIndex];
    if (e.done) e.el.remove();
  }
  impactEffects = impactEffects.filter(e => !e.done);
}

// =====================================================================
// ユニット(1体分)の更新
// =====================================================================
// =====================================================================
// 死亡後のユニット(当たり判定・移動・攻撃は行わず、吹き飛ばしモーションのコマ送りと描画だけ継続する)
// =====================================================================
function tickDeadUnitAnimation(u, now) {
  const motion = u.kind === "catapult" ? MOTIONS_BY_KIND[u.kind].destroy : MOTIONS_BY_KIND[u.kind].knockback;
  const frameDt = Math.max(0, now - u.lastFrameTime);
  const curDuration = (motion.frameDurations ? motion.frameDurations[u.frameIndex] : null) || motion.msPerFrame;

  if (frameDt >= curDuration && u.frameIndex < motion.frames.length - 1) {
    u.frameIndex++;
    u.lastFrameTime = now;
  }

  const idx = Math.min(Math.max(0, u.frameIndex), motion.frames.length - 1);
  const key = motion.frames[idx];
  const frames = FRAMES_BY_KIND[u.kind];
  if (key && frames[key]) u.el.img.src = frames[key];
  if (u.kind === "kurowl") {
    u.el.img.style.transform = `translateX(-50%) scaleX(${u.facing === -1 ? -1 : 1})`;
  } else {
    u.el.img.style.transform = `translateX(-50%) scaleX(${u.facing === -1 ? -1 : 1})`;
  }
  u.el.hpFill.style.width = "0%";
}

function tickUnit(u, now) {
  if (!u.spawned) return;

  if (u.dead) {
    tickDeadUnitAnimation(u, now);
    return;
  }

  const dashKey = u.kind === "kurowl" ? "charge" : "dash";
  const cfg = CONFIG_BY_KIND[u.kind];
  const baseSpeed = cfg.walkSpeed;

  if (u.lockedMotion && now >= u.lockedUntil && u.lockedMotion !== dashKey) {
    if (u.lockedMotion === "down") {
      // ダウン保持が終了 → 起き上がりモーションへ移行
      u.lockedMotion = "getup";
      const getupMotion = MOTIONS_BY_KIND[u.kind].getup;
      setUnitMotion(u, "getup");
      u.lockedUntil = now + motionDuration(getupMotion);
    } else if (u.lockedMotion === "getup") {
      // 起き上がり完了 → ダウン状態を解除して通常行動へ復帰
      u.lockedMotion = null;
      u.isDown = false;
      evaluateUnitState(u, now);
    } else {
      u.lockedMotion = null;
      evaluateUnitState(u, now);
    }
  }

  const target = (u.motionKey === dashKey ? findNextChargeTarget(u) : null) || findNearestTarget(u);
  u.facing = target ? computeFacing(u, target, u.defaultFacing) : u.defaultFacing;

  const moveDt = Math.max(0, now - u.lastMoveTime);
  u.lastMoveTime = now;
  if (u.motionKey === "walk" || u.motionKey === dashKey) {
    const speed = u.motionKey === dashKey ? baseSpeed * cfg.dashSpeedMultiplier : baseSpeed;
    const bounds = combinedUnitBounds(u, u.facing, target);
    const nextX = u.xPx + u.facing * (speed * moveDt) / 1000;
    u.xPx = Math.min(bounds.max, Math.max(bounds.min, nextX));
  }

  if (u.motionKey === dashKey) {
    resolveChargeHit(u);
  }
  if (u.motionKey === dashKey && now >= u.dashUntil) {
    u.lockedMotion = null;
    evaluateUnitState(u, now); // 突撃/突進終了時は種類を問わず必ず再評価して次の行動へ移す
  }
  // 兵士/ゴブリンなど近接タイプは攻撃中でも継続的に再評価してよい(自身は移動しないため)が、
  // クロウルの中距離/近接攻撃は自ら移動・演出するモーションなので、
  // walk中のみ再評価し、攻撃モーションは最後まで中断せず再生し切る
  if ((u.kind !== "kurowl" && u.kind !== "brute") || u.motionKey === "walk") {
    evaluateUnitState(u, now);
  }

  let motion = MOTIONS_BY_KIND[u.kind][u.motionKey];

  if ((u.kind === "kurowl" || u.kind === "brute") && u.motionKey === "midrange" && motion.moveProgressByFrame) {
    const i = Math.min(u.frameIndex, motion.moveProgressByFrame.length - 1);
    const prevProgress = i > 0 ? motion.moveProgressByFrame[i - 1] : 0;
    const nextProgress = motion.moveProgressByFrame[i];
    const curDur = motion.frameDurations ? motion.frameDurations[i] : motion.msPerFrame;
    const frameDtForMove = Math.max(0, Math.min(curDur, now - u.lastFrameTime));
    const withinFrameFrac = curDur > 0 ? frameDtForMove / curDur : 0;
    const progress = prevProgress + (nextProgress - prevProgress) * withinFrameFrac;
    if (Number.isFinite(progress)) {
      const bounds = target ? movementBounds(u, target, u.facing) : { min: 0, max: FIELD.length };
      const leapAdvance = u.kind === "kurowl" ? KUROWL_CONFIG.midrangeLeapAdvance : (u.midrangeLeapAdvance || 0);
      const raw = u.midrangeStartX + u.facing * progress * leapAdvance;
      u.xPx = Math.min(bounds.max, Math.max(bounds.min, raw));
    }
    const heights = motion.jumpHeightByFrame || [];
    const prevH = i > 0 ? (heights[i - 1] || 0) : 0;
    const nextH = heights[i] || 0;
    u.jumpHeightPx = prevH + (nextH - prevH) * withinFrameFrac;
  } else if (u.kind === "kurowl" || u.kind === "brute") {
    u.jumpHeightPx = 0;
  }

  const frameDt = Math.max(0, now - u.lastFrameTime);
  const curDuration = (motion.frameDurations ? motion.frameDurations[u.frameIndex] : null) || motion.msPerFrame;

  if (frameDt >= curDuration) {
    u.frameIndex++;
    u.lastFrameTime = now;

    if (motion.hitFrames && motion.hitFrames.includes(u.frameIndex) && !u.hitAppliedFrames.has(u.frameIndex)) {
      u.hitAppliedFrames.add(u.frameIndex);
      let dmg, label;
      if (u.kind === "kurowl") {
        dmg = u.motionKey === "melee" ? KUROWL_CONFIG.meleeHitDamage : KUROWL_CONFIG.midrangeDamage;
        label = u.motionKey === "melee" ? `クロウル#${u.id}の引っ掻き` : `クロウル#${u.id}の中距離攻撃`;
      } else if (u.kind === "brute") {
        dmg = u.motionKey === "midrange" ? BRUTE_CONFIG.midrangeDamage : cfg.meleeHitDamage;
        dmg = dmg * getBuffMultiplier(u, now);
        label = `${UNIT_LABEL_BY_KIND[u.kind]}#${u.id}の${u.motionKey === "midrange" ? "ジャンプ叩きつけ" : cfg.attackLabel}`;
      } else {
        dmg = cfg.meleeHitDamage * (isGoblinKin(u.kind) ? getBuffMultiplier(u, now) : 1);
        label = `${UNIT_LABEL_BY_KIND[u.kind]}#${u.id}の${cfg.attackLabel}`;
      }
      const hitTarget = findNearestTarget(u);
      if (hitTarget) {
        if (u.kind === "catapult") {
          spawnProjectile(u, hitTarget, label);
        } else {
          applyDamageTo(hitTarget, dmg, label);
        }
      }
      if (u.kind !== "kurowl") playUnitVoice(u, "attack");
      else if (u.motionKey === "midrange") playUnitVoice(u, "midrangeAttack");
    }

    if (u.frameIndex >= motion.frames.length) {
      if (motion.loop) {
        u.frameIndex = 0;
      } else {
        const finishedKey = u.motionKey;
        if (u.kind !== "kurowl" && finishedKey === "attack") {
          u.frameIndex = 0;
          u.lastFrameTime = now;
          u.hitAppliedFrames = new Set();
        } else if (finishedKey === "knockback" || finishedKey === "down" || finishedKey === "getup") {
          u.frameIndex = motion.frames.length - 1;
        } else if (u.kind === "kurowl" && (finishedKey === "melee" || finishedKey === "midrange")) {
          evaluateUnitState(u, now);
          if (u.motionKey === finishedKey) {
            u.frameIndex = 0;
            u.lastFrameTime = now;
            u.hitAppliedFrames = new Set();
            if (finishedKey === "midrange") u.midrangeStartX = u.xPx;
          }
        } else {
          evaluateUnitState(u, now);
        }
        motion = MOTIONS_BY_KIND[u.kind][u.motionKey];
      }
    }
  }

  const renderMotion = MOTIONS_BY_KIND[u.kind][u.motionKey];
  const idx = Math.min(Math.max(0, u.frameIndex), renderMotion.frames.length - 1);
  const key = renderMotion.frames[idx];
  const frames = FRAMES_BY_KIND[u.kind];
  if (key && frames[key]) u.el.img.src = frames[key];
  if (u.kind === "kurowl" || u.kind === "brute") {
    u.el.img.style.transform = `translateX(-50%) scaleX(${u.facing === -1 ? -1 : 1}) translateY(${-(u.jumpHeightPx || 0)}px)`;
  } else {
    u.el.img.style.transform = `translateX(-50%) scaleX(${u.facing === -1 ? -1 : 1})`;
  }
  u.el.img.classList.toggle("buffed-aura", !!(u.buffUntil && now < u.buffUntil));
  u.el.hpFill.style.width = `${Math.max(0, (u.hp / u.maxHp) * 100)}%`;
  checkBruteRoarInterrupt(u, now);
}

// =====================================================================
// 描画位置の反映 + メインループ
// =====================================================================
function render() {
  const playAreaPx = els.field.clientWidth - FIELD.leftMargin - FIELD.rightMargin;
  const scale = playAreaPx > 0 ? playAreaPx / FIELD.length : 1;

  for (const u of allUnits()) {
    if (u.spawned && !u.removed) {
      u.el.unit.style.left = `${FIELD.leftMargin + u.xPx * scale}px`;
    }
  }

  const aliveSoldiers = soldiers.filter(s => !s.dead);
  const aliveKurowls = kurowls.filter(k => !k.dead);
  const aliveGoblins = goblins.filter(g => !g.dead);
  const aliveArchers = archers.filter(a => !a.dead);
  const aliveCatapults = catapults.filter(c => !c.dead);
  const aliveBrutes = brutes.filter(b => !b.dead);
  const soldierSummary = soldiers.length ? `${aliveSoldiers.length}/${soldiers.length}体生存` : "未出撃";
  const kurowlSummary = kurowls.length ? `${aliveKurowls.length}/${kurowls.length}体生存` : "未出撃";
  const goblinSummary = goblins.length ? `${aliveGoblins.length}/${goblins.length}体生存` : "未出撃";
  const archerSummary = archers.length ? `${aliveArchers.length}/${archers.length}体生存` : "未出撃";
  const catapultSummary = catapults.length ? `${aliveCatapults.length}/${catapults.length}体生存` : "未出撃";
  const bruteSummary = brutes.length ? `${aliveBrutes.length}/${brutes.length}体生存` : "未出撃";

  els.statsBox.innerHTML = `
    <div>兵士: <b>${soldierSummary}</b></div>
    <div>クロウル: <b>${kurowlSummary}</b></div>
    <div>ゴブリン: <b>${goblinSummary}</b></div>
    <div>ゴブリン弓兵: <b>${archerSummary}</b></div>
    <div>ゴブリンカタパルト: <b>${catapultSummary}</b></div>
    <div>獰猛なゴブリン: <b>${bruteSummary}</b></div>
    <div>敵軍の城HP: <b>${enemyCastle.hp.toFixed(0)}</b></div>
    <div>自軍の城HP: <b>${allyCastle.hp.toFixed(0)}</b></div>
  `;
}

function tick(now) {
  try {
    if (battleActive) {
      if (lastMoneyTick === 0) lastMoneyTick = now;
      const moneyDt = Math.max(0, now - lastMoneyTick);
      lastMoneyTick = now;
      money += (ECONOMY_CONFIG.moneyPerSecond * moneyDt) / 1000;
      els.moneyText.textContent = Math.floor(money);

      for (const u of allUnits()) tickUnit(u, now);
      tickProjectiles(now);
      tickImpactEffects(now);
      render();

      for (const u of allUnits()) {
        if (u.dead && !u.removed && now >= (u.removeAt || u.deadAt + 2000)) {
          u.removed = true;
          if (u.kind === "catapult" && u.spawnGoblinOnRemove) {
            const g = createUnit("goblin", u.side);
            g.xPx = u.xPx;
            g.facing = u.facing;
            logMsg(`搭乗ゴブリンが瓦礫から立ち上がり、戦線に復帰した!`);
          }
          u.el.unit.remove();
          if (u.kind !== "catapult") {
            logMsg(`${UNIT_LABEL_BY_KIND[u.kind]}#${u.id}の亡骸が消えた。`);
          }
        }
      }
      soldiers = soldiers.filter(s => !s.removed);
      kurowls = kurowls.filter(k => !k.removed);
      goblins = goblins.filter(g => !g.removed);
      archers = archers.filter(a => !a.removed);
      catapults = catapults.filter(c => !c.removed);
      brutes = brutes.filter(b => !b.removed);
    }
  } catch (err) {
    logMsg(`⚠ 内部エラーを検出したため今フレームをスキップしました: ${err.message}`);
  }
  requestAnimationFrame(tick);
}

// =====================================================================
// ボタン操作
// =====================================================================
function spawnUnit(kind, side) {
  const cost = ECONOMY_CONFIG[kind + "Cost"];
  if (money < cost) {
    logMsg(`所持金が足りません(${UNIT_LABEL_BY_KIND[kind]}:${cost}円必要、現在${Math.floor(money)}円)。`);
    return;
  }
  money -= cost;
  const u = createUnit(kind, side);
  const teamLabel = side === "left" ? "敵軍" : "自軍";
  logMsg(`${UNIT_LABEL_BY_KIND[kind]}#${u.id}が${teamLabel}の城から出撃した。(-${cost}円)`);
  if (kind === "goblin") playUnitVoice(u, "taunt");
  if (kind === "catapult") playUnitVoice(u, "warCry");
  if (kind === "brute") triggerBruteRoar(u, performance.now()); // 出現時に確定で1回咆哮し、周囲の味方ゴブリン族にバフを付与
}

function dashAll(kind) {
  const list = kind === "kurowl" ? kurowls : kind === "goblin" ? goblins : kind === "archer" ? archers : kind === "brute" ? brutes : soldiers;
  const targets = list.filter(u => u.spawned && !u.dead && !u.isDown);
  if (!targets.length) return;
  const cfg = CONFIG_BY_KIND[kind];
  const dashKey = kind === "kurowl" ? "charge" : "dash";
  const abilityName = kind === "kurowl" ? "突進" : "突撃！";
  logMsg(`${UNIT_LABEL_BY_KIND[kind]}全員(${targets.length}体)の「${abilityName}」一斉発動 → 3秒間完全無敵で加速し、触れた敵をダウンさせる。`);
  const now = performance.now();
  for (const u of targets) {
    u.lockedMotion = dashKey;
    u.lockedUntil = now + cfg.dashDurationMs;
    u.dashUntil = now + cfg.dashDurationMs;
    u.dashHitTargets = new Set();
    setUnitMotion(u, dashKey);
    // 複数体が一斉に叫ぶことで声が重なるよう、わずかにタイミングをずらして再生
    const delay = Math.floor(Math.random() * 150);
    setTimeout(() => playUnitVoice(u, "warCry"), delay);
  }
}

function clearAllUnits() {
  for (const u of allUnits()) u.el.unit.remove();
  soldiers = [];
  kurowls = [];
  goblins = [];
  archers = [];
  catapults = [];
  brutes = [];
  for (const p of projectiles) p.el.remove();
  projectiles = [];
  for (const e of impactEffects) e.el.remove();
  impactEffects = [];
  unitIdSeq = 0;
}

function reset() {
  clearAllUnits();
  initCastles();
  els.log.innerHTML = "";
  money = 0;
  lastMoneyTick = 0;
  els.moneyText.textContent = "0";
  battleActive = false;
  els.battleScreen.style.display = "none";
  els.formationScreen.style.display = "block";
}

function renderRoster() {
  els.rosterPanel.innerHTML = "";
  for (const item of ROSTER) {
    const el = document.createElement("div");
    el.className = "roster-item" + (selectedRosterKind === item.kind ? " selected" : "");
    el.innerHTML = `
      <img class="roster-icon" src="${item.icon}" alt="${item.name}">
      <div class="roster-body">
        <div class="r-name">${item.name}</div>
        <div class="r-cost">コスト ${item.cost}円</div>
        <div class="r-stats">${item.statsLine}</div>
      </div>
    `;
    el.addEventListener("click", () => {
      const wasSelected = selectedRosterKind === item.kind;
      selectedRosterKind = wasSelected ? null : item.kind;
      renderRoster();
      if (!wasSelected) playVoice(CONFIG_BY_KIND[item.kind].voiceCategory, "warCry");
    });
    els.rosterPanel.appendChild(el);
  }
}

function renderSlots() {
  els.slotGrid.innerHTML = "";
  formationSlots.forEach((kind, i) => {
    const el = document.createElement("div");
    el.className = "slot" + (kind ? " filled" : "");
    if (kind) {
      const item = ROSTER.find(r => r.kind === kind);
      el.innerHTML = `<img class="slot-icon" src="${item.icon}" alt="${item.name}"><div class="slot-cost">${item.cost}円</div>`;
    } else {
      el.innerHTML = `<div class="slot-plus">＋</div>`;
    }
    el.addEventListener("click", () => {
      if (formationSlots[i]) {
        formationSlots[i] = null; // 埋まっている枠はタップで解除
      } else if (selectedRosterKind) {
        formationSlots[i] = selectedRosterKind; // 選択中のユニットを配置
      }
      renderSlots();
    });
    els.slotGrid.appendChild(el);
  });
}

function applyLoadoutToButtons() {
  els.btnSpawnSoldierRight.style.display = loadout.soldier ? "" : "none";
  els.btnSpawnSoldierLeft.style.display = loadout.soldier ? "" : "none";
  els.btnSpawnKurowlLeft.style.display = loadout.kurowl ? "" : "none";
  els.btnSpawnKurowlRight.style.display = loadout.kurowl ? "" : "none";
  els.btnSpawnGoblinRight.style.display = loadout.goblin ? "" : "none";
  els.btnSpawnGoblinLeft.style.display = loadout.goblin ? "" : "none";
  els.btnSpawnArcherRight.style.display = loadout.archer ? "" : "none";
  els.btnSpawnArcherLeft.style.display = loadout.archer ? "" : "none";
  els.btnSpawnCatapultRight.style.display = loadout.catapult ? "" : "none";
  els.btnSpawnCatapultLeft.style.display = loadout.catapult ? "" : "none";
  els.btnSpawnBruteRight.style.display = loadout.brute ? "" : "none";
  els.btnSpawnBruteLeft.style.display = loadout.brute ? "" : "none";
  els.btnDashSoldier.style.display = loadout.soldier ? "" : "none";
  els.btnDashKurowl.style.display = loadout.kurowl ? "" : "none";
  els.btnDashGoblin.style.display = loadout.goblin ? "" : "none";
  els.btnDashArcher.style.display = loadout.archer ? "" : "none";
  els.btnDashBrute.style.display = loadout.brute ? "" : "none";
}

function startBattle() {
  loadout.soldier = formationSlots.includes("soldier");
  loadout.kurowl = formationSlots.includes("kurowl");
  loadout.goblin = formationSlots.includes("goblin");
  loadout.archer = formationSlots.includes("archer");
  loadout.catapult = formationSlots.includes("catapult");
  loadout.brute = formationSlots.includes("brute");
  if (!loadout.soldier && !loadout.kurowl && !loadout.goblin && !loadout.archer && !loadout.catapult && !loadout.brute) {
    els.formationWarning.style.display = "block";
    return;
  }
  els.formationWarning.style.display = "none";
  applyLoadoutToButtons();

  clearAllUnits();
  initCastles();
  els.log.innerHTML = "";
  money = 0;
  lastMoneyTick = 0;
  els.moneyText.textContent = "0";

  els.formationScreen.style.display = "none";
  els.battleScreen.style.display = "block";
  battleActive = true;
  logMsg("戦闘開始。所持金は時間経過で増えていきます。");
}

els.btnDashGoblin.addEventListener("click", () => dashAll("goblin"));
